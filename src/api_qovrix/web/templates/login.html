<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Log in · {{ brand.name }}</title>
  <link rel="stylesheet" href="/static/app.css?v={{ version }}">
  <link rel="stylesheet" href="/brand.css">
  <link rel="icon" href="{{ '/brand/logo' if brand.logo else '/static/favicon.svg' }}">
</head>
<body class="login">
  <div class="login-box">
    {% set brand_href = "/login" %}
    {% include "_brand.html" %}
    <p class="sub">Monitoring dashboard{% if environment %} · {{ environment }}{% endif %}</p>
    <form method="post" action="/login">
      {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit">Log in</button>
    </form>
    <p class="login-foot">{% if status_enabled %}<a href="/status">View the public status page</a> · {% endif %}api-qovrix {{ version }}</p>
  </div>
</body>
</html>
