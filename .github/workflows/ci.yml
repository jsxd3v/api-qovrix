name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 && uv pip install -e ".[dev]"
      - name: Ruff
        run: uv run --no-sync ruff check src tests && uv run --no-sync ruff format --check src tests
      - name: Mypy (strict)
        run: uv run --no-sync mypy
      - name: Security checks
        run: |
          uv pip install bandit pip-audit
          uv run --no-sync bandit -q -r src -lll
          uv run --no-sync pip-audit --skip-editable

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python ${{ matrix.python }} && uv pip install -e ".[dev]"
      - name: Tests (includes JSON Schema freshness)
        run: uv run --no-sync pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: coverage
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: api-qovrix:ci
      - name: Smoke test
        run: |
          docker run --rm api-qovrix:ci --version
          docker run --rm api-qovrix:ci --help

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-test the GitHub Action on the example project
        uses: ./
        with:
          working-directory: examples/public-api
          junit: results.xml
