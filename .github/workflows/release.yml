name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: false  # no .dockerbuild artifact (download-artifact can't extract it)

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the tag matches the package version
        run: |
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          [ "v$version" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
      - run: uv build
      - name: Third-party notices (from a clean runtime install)
        run: |
          uv venv /tmp/notices --python 3.12
          VIRTUAL_ENV=/tmp/notices uv pip install dist/*.whl
          /tmp/notices/bin/python scripts/third_party_notices.py > THIRD_PARTY_NOTICES.md
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: notices
          path: THIRD_PARTY_NOTICES.md

  binaries:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-latest, target: macos-arm64 }
          - { os: macos-15-intel, target: macos-x64 }
          - { os: windows-latest, target: windows-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        shell: bash
        run: |
          python -m pip install . pyinstaller
          pyinstaller --onefile --name api-qovrix \
            --collect-data api_qovrix --collect-submodules uvicorn \
            --collect-data certifi --collect-data jsonschema_specifications --collect-data tzdata \
            --copy-metadata api-qovrix src/api_qovrix/__main__.py
      - name: Smoke test
        shell: bash
        run: |
          ./dist/api-qovrix --version
          ./dist/api-qovrix selftest
          ./dist/api-qovrix validate -c examples/public-api/api-qovrix.yaml
          tmp=$(mktemp -d) && ./dist/api-qovrix init "$tmp" && ./dist/api-qovrix validate -c "$tmp/api-qovrix.yaml"
      - name: Package
        shell: bash
        run: |
          mkdir out
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/api-qovrix.exe "out/api-qovrix-${{ matrix.target }}.exe"
          else
            cp dist/api-qovrix "out/api-qovrix-${{ matrix.target }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: out/

  pypi:
    needs: [dist, binaries]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing, no API token stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true  # safe to re-run a release after PyPI already has these files

  docker:
    needs: [dist]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    needs: [pypi, docker, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "{dist,notices,bin-*}"
          path: artifacts/
      - name: Collect files and checksums
        run: |
          mkdir release
          cp artifacts/bin-*/* artifacts/dist/* release/
          cp scripts/install.sh artifacts/notices/THIRD_PARTY_NOTICES.md LICENSE NOTICE release/
          cd release && sha256sum * > SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: release/*
      - name: Move the major-version tag (e.g. v0) for the GitHub Action
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
