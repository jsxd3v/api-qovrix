name: api-qovrix
description: Run api-qovrix API monitors in CI. Catches breaking API changes, not just downtime.
author: jsxd3v
branding:
  icon: activity
  color: purple

inputs:
  working-directory:
    description: Folder that contains api-qovrix.yaml.
    default: "."
  env:
    description: Environment from api-qovrix.yaml (e.g. staging).
    default: ""
  service:
    description: Only run monitors of these services (space-separated).
    default: ""
  tag:
    description: Only run monitors with these tags (space-separated).
    default: ""
  monitors:
    description: Only run these monitors (space-separated).
    default: ""
  junit:
    description: Path for a JUnit XML report (relative to working-directory).
    default: api-qovrix-results.xml
  html:
    description: Path for a self-contained HTML report (relative to working-directory). Empty = none.
    default: ""
  notify:
    description: Send alerts to the configured notifiers when monitors fail ("true" or "false").
    default: "false"
  args:
    description: Extra arguments for 'api-qovrix run'.
    default: ""
  python-version:
    description: Python used to run api-qovrix.
    default: "3.12"

outputs:
  junit:
    description: Path of the JUnit report.
    value: ${{ steps.run.outputs.junit }}
  html:
    description: Path of the HTML report (if requested).
    value: ${{ steps.run.outputs.html }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install api-qovrix
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"
    - name: Run monitors
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_ENV: ${{ inputs.env }}
        INPUT_SERVICE: ${{ inputs.service }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_MONITORS: ${{ inputs.monitors }}
        INPUT_JUNIT: ${{ inputs.junit }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_NOTIFY: ${{ inputs.notify }}
        INPUT_HTML: ${{ inputs.html }}
      run: |
        args=(run)
        [ -n "$INPUT_ENV" ] && args+=(--env "$INPUT_ENV")
        for s in $INPUT_SERVICE; do args+=(--service "$s"); done
        for t in $INPUT_TAG; do args+=(--tag "$t"); done
        [ -n "$INPUT_JUNIT" ] && args+=(--junit "$INPUT_JUNIT")
        [ "$INPUT_NOTIFY" = "true" ] && args+=(--notify)
        [ -n "$INPUT_HTML" ] && args+=(--html "$INPUT_HTML")
        # shellcheck disable=SC2206
        extra=($INPUT_ARGS)
        echo "junit=$INPUT_JUNIT" >> "$GITHUB_OUTPUT"
        echo "html=$INPUT_HTML" >> "$GITHUB_OUTPUT"
        # shellcheck disable=SC2086
        api-qovrix "${args[@]}" "${extra[@]}" $INPUT_MONITORS
