# Run api-qovrix next to your app: it checks your API on a schedule, keeps history, sends alerts
# and serves a dashboard.
#   1. Put api-qovrix.yaml and monitors/ in ./monitoring (see examples/public-api)
#   2. Create a .env file next to this one with the variables below (never commit it)
#   3. docker compose up -d && docker compose logs -f api-qovrix
#   4. Open http://localhost:8080 (or put your reverse proxy with HTTPS in front of it)
services:
  api-qovrix:
    image: ghcr.io/jsxd3v/api-qovrix:latest
    command: serve
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"      # dashboard + REST API; only this machine (use a reverse proxy for HTTPS)
    volumes:
      - ./monitoring:/work:ro      # your monitor files (read-only)
      - qovrix-data:/data          # run history (SQLite)
    environment:
      API_QOVRIX_PASSWORD: ${API_QOVRIX_PASSWORD}   # dashboard login (required in Docker, 8+ characters)
      API_QOVRIX_API_KEY: ${API_QOVRIX_API_KEY}     # optional: REST API access for scripts
      API_TOKEN: ${API_TOKEN}                       # secrets your monitors use
      CHAT_WEBHOOK_URL: ${CHAT_WEBHOOK_URL}         # notifier settings
      SMTP_URL: ${SMTP_URL}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  qovrix-data:
